name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # Lets the full gate be re-run without an empty commit, for example after a
  # repository setting changes what the HACS and CodeQL jobs are allowed to do.
  # weekly.yml also starts it this way.
  workflow_dispatch:

permissions:
  contents: read

# A superseded push has nothing left to prove, and the ESP compiles are the
# expensive part of this workflow.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint and test (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is the oldest Python ESPHome 2026.9 supports; the top
        # entry is what a current ESPHome install actually runs on.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -c requirements/esphome-lts-2026.11.txt
      - name: Lint Python
        run: ruff check components tests tools custom_components
      - name: Run tests
        run: pytest
      - name: Fuzz production UART parser and raw input
        if: matrix.python-version == '3.14'
        run: python tools/run_native_tests.py --fuzz
      - name: Lint YAML
        run: yamllint -c .yamllint.yml examples .github

  esphome:
    name: esphome ${{ matrix.target }} config and compile
    runs-on: ubuntu-24.04
    # SUPPORT.md promises the LTS pin, the minimum and every newer stable
    # release. A beta failure is an early warning, not a broken promise.
    continue-on-error: ${{ matrix.target == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lts
            python-version: "3.12"
          - target: minimum
            python-version: "3.12"
          - target: stable
            python-version: "3.14"
          - target: beta
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ESPHome
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m pip install --upgrade pip
          case "$TARGET" in
            lts) python -m pip install ".[dev]" -c requirements/esphome-lts-2026.11.txt ;;
            minimum) python -m pip install -r requirements/esphome-minimum.txt ;;
            *)
              version=$(python tools/resolve_upstream_version.py esphome "$TARGET")
              python -m pip install "esphome==$version"
              ;;
          esac
      - name: Report the resolved ESPHome version
        shell: bash
        run: esphome version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare CI example configs
        run: python tools/prepare_ci_configs.py
      - name: Validate ESPHome YAMLs
        run: |
          for config in .ci/yamaha_rx_v*.yaml; do
            esphome config "$config"
          done
      - name: Compile ESPHome basic example (ESP32)
        run: esphome compile .ci/yamaha_rx_v_basic.yaml
      - name: Compile ESPHome full example (ESP8266)
        shell: bash
        run: esphome compile .ci/yamaha_rx_v_full.yaml | tee /tmp/yamaha_rx_v_full_compile.log
      - name: Check ESP8266 full example size budget
        run: python tools/check_compile_size.py /tmp/yamaha_rx_v_full_compile.log --max-ram 48000 --max-flash 520000

  companion:
    name: HA companion runtime (${{ matrix.target }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.target == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        target: [lts, minimum, stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Home Assistant
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            lts) python -m pip install -r requirements/ha-lts-2026.11.txt ;;
            minimum) python -m pip install -r requirements/ha-minimum.txt ;;
            *)
              version=$(python tools/resolve_upstream_version.py homeassistant "$TARGET")
              python -m pip install -r requirements/ha-test.txt "homeassistant==$version"
              ;;
          esac
          python -m pip show homeassistant | grep '^Version' | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python -m pytest tests/test_companion_runtime.py

  hacs:
    name: hacs
    # The action reads hacs.json and the companion manifest back as file
    # content, and those reads return nothing while the repository is private,
    # so the checks fail as "Got None" no matter what the files contain. The
    # action already defaults github_token to the workflow token, so this is
    # not a missing-credential problem. The job therefore waits until the
    # repository is public instead of failing every push.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
