version: 2
# LTS: version refreshes are deliberate maintenance, not recurring bot PRs.
# A zero limit disables version PRs only. Security PRs have a separate limit.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
