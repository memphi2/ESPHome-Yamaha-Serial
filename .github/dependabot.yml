version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    # Dependabot updates the dev extra in pyproject.toml.
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Python majors are compatibility work, not routine maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # The ESPHome floor is the version CI compiles against and is bumped
      # manually, together with the baseline stated in SUPPORT.md.
      - dependency-name: "esphome"
        versions:
          - ">=0"
