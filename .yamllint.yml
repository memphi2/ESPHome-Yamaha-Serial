extends: default

rules:
  document-start: disable
  line-length:
    max: 140
    level: warning
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  comments:
    # Actions are SHA-pinned with a trailing "# vN" comment, which is the
    # conventional one-space form.
    min-spaces-from-content: 1
