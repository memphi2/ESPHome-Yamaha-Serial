esphome:
  name: yamaha-rxv1900
  friendly_name: Yamaha RX-V1900

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Requires encrypted OTA, using the API encryption key.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

external_components:
  - source: github://memphi2/ESPHome-Yamaha-Serial
    components: [yamaha_serial]

# UART side is TTL (ESP), receiver side is RS-232.
# Use MAX3232 or equivalent converter, do not wire DB9 directly to GPIO.
# On the receiver, set ADVANCED SETUP > RS-232C STANDBY to YES (the default is NO
# outside the US/Canada), otherwise it cannot be controlled from standby.
uart:
  - id: uart_yamaha
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

# A main-zone example: media player, input and sound controls, and the tuner.
# Tested on an RX-V1900 G/E (UK/Europe) unit; U/C/J models add regional modes.
# Zone 2, System Memory, tone and speaker setup entities are available too; see
# examples/yamaha_rx_v_full.yaml for the keys. The RX-V1900 has no Speaker A/B
# relays, fan control or night mode, and the profile has no sleep timer control
# (its Off is never reported back; use a Home Assistant automation instead).
#
# No inputs: block is needed. The RX-V1900 profile already has the receiver's
# inputs: PHONO, CD, Tuner, MD/CD-R, DVD, BD/HD DVD, TV, CBL/SAT, VCR, DVR,
# V-AUX, USB, Multi CH and DOCK.
yamaha_serial:
  id: yamaha
  uart_id: uart_yamaha
  model: "RX-V1900"
  # Extended profile: needed for the FM/AM frequency controls.
  receiver_profile: rx_v1900_extended
  poll_interval: never
  diagnostics_interval: 60s
  # Allows raw commands through media_player.play_media (yamaha://raw/...).
  allow_raw_commands: true
  command_timeout: 1500ms
  max_retries: 2
  command_spacing: 120ms
  power_on_delay: 2s
  volume:
    min: -80
    # Full receiver range; lower max to cap the volume from HA.
    max: 16.5
    step: 0.5

# Power, volume, mute and input (source) for the main zone.
media_player:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    receiver:
      name: Yamaha Receiver

switch:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    pure_direct:
      name: Yamaha Pure Direct

button:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    refresh:
      name: Yamaha Refresh
  - platform: restart
    name: Yamaha ESP Restart

number:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    # Tuner ranges are regional. Europe/UK: FM 87.5-108 MHz (0.05 MHz steps),
    # AM 531-1611 kHz (9 kHz steps). US/Canada (untested): FM 87.5-107.9 MHz
    # (0.2 MHz steps), AM 530-1710 kHz (10 kHz steps). Front-panel tuning sends
    # no serial report, so the frequency only refreshes on Refresh or after
    # setting it from HA.
    tuner_fm_frequency:
      name: Yamaha FM Frequency
      mode: box
      min_value: 87.5
      max_value: 108
      step: 0.05
    tuner_am_frequency:
      name: Yamaha AM Frequency
      mode: box
      min_value: 531
      max_value: 1611
      step: 9

select:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    input_source:
      name: Yamaha Input
    program:
      name: Yamaha Program
    audio_select:
      name: Yamaha Audio Select
    tuner_band:
      name: Yamaha Tuner Band
    # Pro Logic / PLII / Neo:6 for 2-channel sources (analog or digital).
    # Selecting one switches the program to Surround Decode first. On a
    # multichannel source the receiver keeps (and HA shows) the stored setting,
    # but decodes the source format instead.
    surround_decoder:
      name: Yamaha Surround Decoder

sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    sampling_rate:
      name: Yamaha Sampling Rate
    last_response_age:
      name: Yamaha Last Response Age
      disabled_by_default: true
    commands_sent:
      name: Yamaha Commands Sent
      disabled_by_default: true
    responses_received:
      name: Yamaha Responses Received
      disabled_by_default: true
    parse_errors:
      name: Yamaha Parse Errors
      disabled_by_default: true
    timeouts:
      name: Yamaha Timeouts
      disabled_by_default: true
    queue_drops:
      name: Yamaha Queue Drops
      disabled_by_default: true

text_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    playback_format:
      name: Yamaha Playback Format
    receiver_model:
      name: Yamaha Receiver Model
    connection_state:
      name: Yamaha Connection State
    last_error:
      name: Yamaha Last Error
      disabled_by_default: true
    last_parse_error:
      name: Yamaha Last Parse Error
      disabled_by_default: true

binary_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    availability:
      name: Yamaha Availability
