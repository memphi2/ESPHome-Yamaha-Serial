esphome:
  name: yamaha-rxv-basic
  friendly_name: Yamaha RX-V Basic

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

external_components:
  - source: github://memphi2/ESPHome-Yamaha-Serial
    components: [yamaha_serial]

uart:
  - id: uart_yamaha
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

yamaha_serial:
  id: yamaha
  uart_id: uart_yamaha
  model: "RX-V1600"
  receiver_profile: auto
  poll_interval: never
  command_timeout: 1500ms
  max_retries: 2
  command_spacing: 100ms
  power_on_delay: 2s
  inputs:
    tuner: "Tuner"
    cd: "CD"
    dvd: "DVD"
    dtv_ld: "D-TV/LD"
    vaux: "V-AUX"
  volume:
    min: -80
    max: 16
    step: 0.5

media_player:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    receiver:
      name: Yamaha Receiver

sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    last_response_age:
      name: Yamaha Last Response Age

text_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    connection_state:
      name: Yamaha Connection State
    last_error:
      name: Yamaha Last Error
    receiver_model:
      name: Yamaha Receiver Model

binary_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    availability:
      name: Yamaha Availability
